<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎵 آهنگ‌های من</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: Tahoma, sans-serif;
  background: linear-gradient(135deg, #667eea, #764ba2);
  min-height: 100vh;
  padding: 20px;
}
h1 {
  text-align: center;
  color: white;
  font-size: 2.5rem;
  margin-bottom: 10px;
}
.subtitle {
  text-align: center;
  color: rgba(255,255,255,0.9);
  margin-bottom: 30px;
}
.songs {
  max-width: 800px;
  margin: 0 auto;
  display: grid;
  gap: 20px;
}
.song {
  background: white;
  border-radius: 15px;
  padding: 20px;
  display: flex;
  gap: 20px;
  align-items: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
.cover {
  width: 80px;
  height: 80px;
  border-radius: 10px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  flex-shrink: 0;
}
.info { flex: 1; min-width: 0; }
.info h3 { color: #333; margin-bottom: 8px; word-break: break-word; }
audio { width: 100%; height: 40px; }
.btn {
  display: inline-block;
  background: #06d6a0;
  color: white;
  padding: 10px 20px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
  margin-top: 10px;
}
.btn:hover { background: #05b586; }
@media (max-width: 600px) {
  h1 { font-size: 1.8rem; }
  .song { flex-direction: column; text-align: center; }
  .cover { width: 120px; height: 120px; }
}
</style>
</head>
<body>

<h1>🎵 آهنگ‌های من</h1>
<p class="subtitle">اینجا می‌تونی آهنگ‌های من رو گوش بدی و دانلود کنی</p>

<div class="songs">

  <div class="song">
    <div class="cover">🎵</div>
    <div class="info">
      <h3>علی منتظری - جانان</h3>
      <audio controls preload="none" src="janan.mp3"></audio>
      <a href="janan.mp3" download="janan.mp3" class="btn">⬇️ دانلود</a>
    </div>
  </div>

  <div class="song">
    <div class="cover">🎵</div>
    <div class="info">
      <h3>علی ایزدی - محلی شیرازی</h3>
      <audio controls preload="none" src="mahali.mp3"></audio>
      <a href="mahali.mp3" download="mahali.mp3" class="btn">⬇️ دانلود</a>
    </div>
  </div>

</div>

</body>
</html>
